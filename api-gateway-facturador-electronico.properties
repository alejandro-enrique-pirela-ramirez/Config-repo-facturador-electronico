# ---- Rutas del Gateway con Circuit Breaker ----
spring.cloud.gateway.server.webmvc.routes[0].id=ms-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ms-auth-facturador-electronico
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/usuarios/**

spring.cloud.gateway.server.webmvc.routes[1].id=ms-cliente
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ms-cliente-facturador-electronico
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/clientes/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=CircuitBreaker=clienteCircuitBreaker,fallbackUri=forward:/fallback/clientes

spring.cloud.gateway.server.webmvc.routes[2].id=ms-producto
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ms-producto-facturador-electronico
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/productos/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=CircuitBreaker=productoCircuitBreaker,fallbackUri=forward:/fallback/productos

spring.cloud.gateway.server.webmvc.routes[3].id=ms-factura
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ms-factura
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/facturas/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=CircuitBreaker=facturaCircuitBreaker,fallbackUri=forward:/fallback/facturas

spring.cloud.gateway.server.webmvc.routes[4].id=ms-envio
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://ms-envio-factura
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/envios/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=CircuitBreaker=envioCircuitBreaker,fallbackUri=forward:/fallback/envios

# ---- Configuracion Resilience4j Circuit Breaker ----
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5000
resilience4j.timelimiter.configs.default.timeout-duration=5s
